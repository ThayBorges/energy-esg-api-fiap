services:
  api:
    image: energy-esg-api:${IMAGE_TAG}
    container_name: energy-esg-api-production
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: ${CONNECTION_STRING}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    ports:
      - "${API_PORT}:8080"
    depends_on:
      - sqlserver
    networks:
      - energy-esg-production-net

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: energy-esg-sql-production
    restart: unless-stopped
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
    ports:
      - "${SQL_PORT}:1433"
    volumes:
      - sqlserver-production-data:/var/opt/mssql
    networks:
      - energy-esg-production-net

volumes:
  sqlserver-production-data:

networks:
  energy-esg-production-net:
    driver: bridge
